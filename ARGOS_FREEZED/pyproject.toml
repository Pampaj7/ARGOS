[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argos-freezed"
version = "1.0.0"
description = "ARGOS v2 frozen geometry-v1 implementation"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
